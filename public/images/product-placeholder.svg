<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#cbd5e1" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <g transform="translate(200, 170)">
    <circle r="52" fill="#FE0000" opacity="0.08"/>
    <circle r="42" fill="#FE0000" opacity="0.12"/>
    <!-- Icono de cubo / ladrillo 3D estilizado -->
    <path d="M 0 -30 L 30 -12 L 30 20 L 0 38 L -30 20 L -30 -12 Z" fill="#ffffff" stroke="#FE0000" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 0 -30 L 0 38" stroke="#FE0000" stroke-width="2"/>
    <path d="M 0 -12 L 30 -30" stroke="#FE0000" stroke-width="2"/>
    <path d="M 0 -12 L -30 -30" stroke="#FE0000" stroke-width="2"/>
  </g>
  <text x="200" y="260" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#111827" text-anchor="middle" letter-spacing="1">FERRENINAN</text>
  <text x="200" y="282" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748b" text-anchor="middle">Materiales para Construcción</text>
</svg>